[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/api/assistant"
  to = "/.netlify/functions/assistant"
  status = 200

[[redirects]]
  from = "/api/scan-receipt"
  to = "/.netlify/functions/scan-receipt"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
